# Sobe banco, API e interface com um único comando:
#   docker compose up -d --build
# Só o banco (para desenvolver com npm no backend e no frontend):
#   docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: mercado-jogadores-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercado_jogadores
      POSTGRES_USER: mercado_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado_app -d mercado_jogadores"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mercado-jogadores-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro do Compose o banco é acessado pelo nome do serviço (postgres), não por localhost.
      DATABASE_URL: postgresql://mercado_app:${POSTGRES_PASSWORD}@postgres:5432/mercado_jogadores?schema=public
      PORT: "3000"
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço da API como o NAVEGADOR enxerga (a máquina do usuário, não a rede do Compose).
        NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    container_name: mercado-jogadores-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
