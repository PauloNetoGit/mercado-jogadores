
services:
  postgres:
    image: postgres:16
    container_name: mercado-jogadores-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercado_jogadores
      POSTGRES_USER: mercado_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado_app -d mercado_jogadores"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
